services:
  lswui:
    build:
      context: .
      args:
        # Optionale Voreinstellungen – der Benutzer kann sie auch in der UI ändern
        LSWUI_ANALYSE_URL: ${LSWUI_ANALYSE_URL:-https://api.leichte-sprache.ai/analyse?format=full}
        LSWUI_BASE_URL: ${LSWUI_BASE_URL:-}
        LSWUI_MODEL: ${LSWUI_MODEL:-}
        LSWUI_API_KEY: ${LSWUI_API_KEY:-}
    image: lswui:latest
    ports:
      - "${LSWUI_PORT:-8087}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
